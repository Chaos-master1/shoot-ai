[project]
name = "kawkab-ai"
version = "0.13.2"
description = "AI Football Coach for Amateur Teams - Local, Private, Free"
authors = [{ name = "Kawkab AI" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["football", "soccer", "ai", "coach", "tactics", "video-analysis", "yolo", "computer-vision"]

dependencies = [
    "PySide6>=6.6.0",
    "qasync>=0.27.1",
    "ultralytics>=8.4.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "loguru>=0.7.2",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "ffmpeg-python>=0.2.0",
    "mplsoccer>=1.4.0",
    "kloppy>=3.12.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.2.0",
    "tqdm>=4.66.0",
    "lap>=0.4.0",
    "soccerplots>=1.0.0",
    "easyocr>=1.7.0",
    "onnx<1.19",
    "norfair>=2.3.0",
    "motmetrics>=1.4.0",
    "EasySoccerData>=0.0.8",
    # EasySoccerData's Sofascore client (esd.sofascore.service) imports
    # playwright directly but doesn't declare it as ITS OWN dependency, so
    # it must be declared here or `import esd` raises ModuleNotFoundError.
    # No kawkab code imports playwright directly -- confirmed via clean
    # venv install + test run (a grep-only check misses this transitive
    # need, since it only shows up as a runtime ImportError three imports
    # deep inside easy_soccer_service.py's `import esd`).
    "playwright>=1.60.0",
    "cryptography>=42.0.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
gpu = [
    "torch[cuda]>=2.2.0",
]
reid = [
    "boxmot>=19.0.0,<22",
]
enhancement = []
cloud = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    # kawkab.cloud.models uses pydantic's EmailStr (UserRegister, UserLogin,
    # TeamInvite) -- pydantic defers to this package for validation and
    # raises ImportError at class-definition time without it. Discovered
    # via a clean `pip install -e ".[test,cloud]"` (what CI actually runs)
    # failing test collection on kawkab.cloud.server; it was masked
    # locally by email-validator being present as some other transitive
    # dependency.
    "email-validator>=2.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    # test_tracking_real_footage.py imports sklearn at collection time
    # (KMeans pitch-zone fixtures); undeclared, it failed coverage-job
    # collection only after the earlier "No module named pytest" bug was
    # fixed -- the kind of masked gap that surfaces one layer at a time.
    "scikit-learn>=1.4.0",
]
audio = [
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
tactical = [
    "socceraction>=1.5.0",
]
pose = [
    "sports2d>=0.5.0",
]
graph = [
    "networkx>=3.2.0",
    "python-louvain>=0.16",
]
dev = [
    # Hard-pinned (not ranges): CI runs `uv run ruff/mypy` against these
    # extras, and an unpinned range means a new upstream release can flip
    # the lint/typecheck gates without any code change. The pinned
    # versions are the ones the gates were verified green against.
    "ruff==0.16.6",
    "mypy==2.3.1",
    "typeguard>=4.0.0",
]
build = [
    "pyinstaller>=6.3.0",
    "pyinstaller-hooks-contrib>=2024.1",
    "nuitka>=2.0.0",
]
lightglue = [
    "onnxruntime-gpu>=1.27.0",
]
face = [
    "insightface>=1.0.1",
]
sports = [
    "supervision>=0.18.0",
    "sports @ git+https://github.com/roboflow/sports.git",
]

[project.urls]
Homepage = "https://github.com/wizard404error/shoot-ai"
Repository = "https://github.com/wizard404error/shoot-ai"
Issues = "https://github.com/wizard404error/shoot-ai/issues"

[project.scripts]
kawkab = "kawkab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The `sports` extra pins a VCS ("direct reference") dependency
# (sports @ git+https://github.com/roboflow/sports.git). Hatchling
# refuses to generate metadata for ANY install of this package -- not
# just `pip install -e ".[sports]"` -- unless this is set, because it
# validates every optional-dependencies group up front. Without this,
# `pip install -e ".[test,cloud]"` (what every CI job runs) fails before
# pytest ever executes a single test.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kawkab"]
# src/kawkab/web/dist/ is gitignored (it's a build artifact, not source --
# see .gitignore) but the wheel still needs it: hatchling excludes
# VCS-ignored paths from the sdist/wheel by default, which meant a plain
# `python -m build` produced a wheel whose index.html referenced a JS
# bundle that was never included. `artifacts` force-includes generated
# files despite the VCS ignore. This only works if the frontend has
# actually been built first (`node scripts/bundle-js.mjs` from
# `src/kawkab/web`) -- release.yml runs that before `python -m build`.
artifacts = ["src/kawkab/web/dist/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

# tests/ deliberately calls install_kawkab_stubs() before importing the module
# under test (see CLAUDE.md "module isolation" invariant) -- that import order
# is required, not an oversight, so E402 is noise there.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# Matrix/homography variable names (H, R, T, X, X_list) follow standard CV/ML
# notation and are clearer than the lowercase ruff wants.
"src/kawkab/analysis/xgot_model.py" = ["N806"]
"src/kawkab/services/multi_camera_service.py" = ["N806"]
"tests/unit/test_multi_camera_fusion.py" = ["N806"]
"tests/unit/test_lightglue_homography_service.py" = ["N806"]
"tests/unit/test_xg_trainer.py" = ["N806"]
# Feature-matrix variables (X, X_train, X_val) in the validation trainers —
# same standard ML notation as test_xg_trainer above.
"src/kawkab/core/validation/train_psxg.py" = ["N806"]
"scripts/validate_models.py" = ["N806"]

# ── Naming rules: domain-notation exceptions (2026-09-17 lint pass) ─────────
# Each entry documents WHY the non-lowercase name is correct, not lazy.

# Kalman-filter matrices: F/Q/H/K/P are the textbook state-transition,
# process-noise, measurement, Kalman-gain and covariance symbols.
"src/kawkab/services/kalman_smoother.py" = ["N806"]
"src/kawkab/services/track_smoother.py" = ["N806"]

# Homography matrices (H) and Kabsch rotation matrices (R) — standard CV
# notation; R_true is ground-truth rotation in the Kabsch port tests.
"src/kawkab/services/lightglue_homography_service.py" = ["N806"]
"src/kawkab/services/homography_service.py" = ["N806", "N803"]
"tests/unit/test_kabsch_extended.py" = ["N806"]
"tests/unit/test_zalgo_algorithm_ports.py" = ["N806"]
"tests/integration/test_full_pipeline.py" = ["N806"]

# Sliding-window detection params (winW/winH) follow the OpenCV
# pyramid/sliding-window tutorial naming.
"src/kawkab/services/raindrop_detection_service.py" = ["N806"]

# xG/xT feature matrices and the calibration design matrix (X, X_train, A, T)
# — standard ML/statistics notation; xT itself is the domain term.
"src/kawkab/core/xg_trainer.py" = ["N806", "N803"]
"src/kawkab/core/xg_calibration.py" = ["N806"]
"src/kawkab/core/model_comparison.py" = ["N806"]
"src/kawkab/core/territory_value.py" = ["N806", "N815"]
"src/kawkab/core/xt_model.py" = ["N806", "N802"]
"src/kawkab/core/ball_physics_pitch_control.py" = ["N806", "N803"]

# Dataclass fields carry the xT domain term (xT_gained/xT_prevented/...);
# renaming them would break every consumer for zero clarity gain.
"src/kawkab/core/set_piece_xt.py" = ["N815", "N803"]
"src/kawkab/core/defensive_xt.py" = ["N815", "N803"]
"src/kawkab/core/through_ball.py" = ["N815", "N803"]
"src/kawkab/services/positioning_service.py" = ["N815"]

# Qt Signal class attributes are camelCase BY CONTRACT — QWebChannel exposes
# them to JS under exactly these names (app.js/app-import.js connect to
# analysisProgress/importProgress); renaming breaks the live UI.
"src/kawkab/ui/bridge.py" = ["N815"]

# Test fixtures/factories reuse domain dataclass names as local aliases
# (MatchTrackData, Detection, MetricsCollector, ...) and xT in test names.
"tests/unit/test_phase4_analytics.py" = ["N803", "N802"]
"tests/unit/test_six_new_services.py" = ["N802"]
"tests/e2e/test_e2e_pipeline.py" = ["N806"]
"tests/e2e/test_e2e_full_pipeline.py" = ["N806"]
"tests/e2e/test_pipeline_e2e.py" = ["N806"]
"tests/unit/test_integration_pro_pipeline.py" = ["N806"]
"tests/unit/test_live_xg_trained_path.py" = ["N806"]

# Circle-overlap IoU helper: R/r are the radii of the two circles.
"scripts/evaluate_ball_tracker.py" = ["N806"]
# Pass-network adjacency matrix A — standard graph notation.
"src/kawkab/core/pass_network.py" = ["N806"]
# Poisson PMF: L = exp(-lambda) per the classic Knuth formulation.
"src/kawkab/core/league_simulation.py" = ["N806", "E402"]
# Spectrogram matrix Sxx is the canonical scipy.signal.spectrogram name.
"src/kawkab/services/card_detection_service.py" = ["N806"]
# app.py closeEvent: Qt lifecycle hook — the name is fixed by Qt's virtual
# method table; renaming would silently disable window-close cleanup.
"src/kawkab/app.py" = ["N802"]

# ── E402 (import not at top): each site is deliberate ─────────────
# scripts/: sys.path bootstrap must run before project imports.
"scripts/download_soccernet.py" = ["E402"]
"scripts/download_tracking_only.py" = ["E402"]
"scripts/migrate_pg_v2.py" = ["E402"]
"scripts/train_xg_from_statsbomb.py" = ["E402"]
# cloud/server.py: FastAPI app object + middleware must exist before
# route modules import it at module level.
"src/kawkab/cloud/server.py" = ["E402"]
# xg_model.py: logger block between import groups (stdlib → logger → kawkab
# imports); order is load-bearing for logging setup, and moving imports
# would reorder module init.
"src/kawkab/core/xg_model.py" = ["E402"]

[tool.ruff.format]
# ruff format replaces black (see .pre-commit-config.yaml) -- having both
# active fought each other, each reformatting in a slightly different way
# on every commit. Matching black's own defaults here keeps the diff
# against the pre-ruff-format history minimal.
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# NOT strict: turning this on and actually running it (this was configured
# but never run until the 2026-07-30 audit) produces 2,885 errors across 203
# of 299 files -- 82% of them type-arg/no-untyped-def/no-untyped-call/
# no-any-return, i.e. "this 125k-LOC codebase was never written with
# complete annotations", not bugs. A gate nobody can pass gets ignored, which
# is the exact hollow-quality-gate failure mode this audit otherwise fixed.
# The real bugs mypy found (undefined names, calls to nonexistent methods --
# see CLAUDE.md, "What was fixed this session") show up without strict mode
# too; that's the class of error worth gating on until the codebase earns
# full annotation coverage module-by-module (see the kawkab.utils.* override
# below for what that opt-in looks like).
warn_unused_configs = true
ignore_missing_imports = true
# warn_return_any was flipped off globally in the 2026-09 delivery pass: after
# the real-bug categories were fixed (see the "Fix 40+ latent runtime bugs"
# commit), its remaining 76 hits were all "returns Any from an untyped-dep
# boundary" (requests .json(), numpy, cv2) -- annotation-coverage debt, not
# bug debt. It stays ON in the opt-in strict modules below (kawkab.utils.*,
# kawkab.i18n.*, and the six services), which is where the coverage ladder
# actually gets climbed.

# Per-file overrides for files that legitimately need looser typing
[[tool.mypy.overrides]]
module = "kawkab.services.cv_service"
ignore_errors = true

# QWebChannel boundary: every slot is a JS-facing `def slot(...) -> None`
# decorated with @Slot, hand-bridging dicts across the process edge. The 287
# findings were Optional-dict plumbing and missing annotations on the ~180
# slot bodies -- mechanical to silence, pointless to churn; typed rework
# belongs to a dedicated bridge refactor, not a delivery gate.
[[tool.mypy.overrides]]
module = "kawkab.ui.bridge"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kawkab.services.analysis_service"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kawkab.utils.*"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "kawkab.i18n.*"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "kawkab.services.positioning_service",
  "kawkab.services.player_development_service",
  "kawkab.services.workload_service",
  "kawkab.services.scouting_service",
  "kawkab.services.video_review_service",
  "kawkab.services.pitch_detector",
  "kawkab.services.periodization_service",
]
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, may require external deps)",
    "slow: Slow tests (>5s)",
    "requires_ultralytics: Requires ultralytics package",
    "requires_cuda: Requires CUDA GPU",
    "requires_models: Requires downloaded ML model weights",
    "load: Load/benchmark test (see tests/test_load.py, pass --run-load to enable)",
    "benchmark: Performance regression benchmark, off by default (pass --run-load)",
]

[tool.coverage.run]
source = ["src/kawkab"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
# Previously also excluded "logger\.(debug|info|warning|error)" and bare
# "return" -- those match a huge fraction of ordinary executable lines
# (any function that logs or returns a value), so they were silently
# excluding real, untested code from the denominator and inflating the
# reported percentage. Removed; fail_under lowered to the real measured
# floor (see CLAUDE.md for the measurement this was calibrated against).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if __debug__:",
    "\\.\\.\\.",
]
show_missing = true
precision = 2
# Measured 69.47% with the exclusions above (tests/unit/, full suite,
# 2026-07-29 -- see CLAUDE.md). Set a few points below that as a real
# regression gate, not the old hardcoded-and-never-checked 30%.
fail_under = 65
