repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # ruff-format replaces black -- running both meant every commit got
      # reformatted twice, each tool undoing part of the other's changes,
      # so the pre-commit hook loop never settled. See [tool.ruff.format]
      # in pyproject.toml (configured to match black's own defaults).
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-PyYAML]
        exclude: ^tests/
