name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5"

env:
  PYTHONPATH: src

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Pinned tool versions (match pyproject [dev] extra + test.yml):
        # an unpinned `pip install ruff mypy` floats to the latest release,
        # which can flip the gate without any code change.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.6 mypy==2.3.1
      - name: ruff lint
        run: ruff check src/ tests/ --ignore E501
      - name: ruff format check
        run: ruff format --check src/ tests/

  docs-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs-truth check (doc claims must match code-inventoried counts)
        # The docs once claimed "500+ rules / 500+ drills" over a KB of 40
        # rule files and 24 drills. This gate makes doc drift a CI failure,
        # not a reputation problem discovered by a user.
        run: python scripts/check_docs_truth.py

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        # libegl1/libgl1: Qt (imported via kawkab.app by test_entrypoints)
        # needs them at import time — their absence failed the unit job with
        # ImportError: libEGL.so.1 (same fix test.yml's gui-e2e job uses).
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg libegl1 libgl1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,cloud]"
      - name: Run unit tests (core analytical)
        env:
          KAWKAB_JWT_SECRET: ci-test-secret-do-not-use-in-production
        # Previously ignored 20 files here. Verified against a clean
        # `pip install -e ".[test,cloud]"` (this exact command, in an
        # isolated venv) rather than trusting the ambient dev environment,
        # which had extra packages installed that masked real gaps:
        #   - test_audio_service.py: genuinely failing (stale test file,
        #     source had moved on) -- fixed, see CLAUDE.md.
        #   - test_easy_soccer_service.py: needed `playwright` (a
        #     transitive import of EasySoccerData's Sofascore client) --
        #     now declared in the `cloud` extra.
        #   - test_norfair_tracker.py: needed a real norfair_tracker.py bbox
        #     fix (norfair>=2.3 validates Detection points strictly as
        #     (N,4)) plus a test-isolation fix (its norfair/cv2 stubs only
        #     applied if not already imported, so a real install silently
        #     defeated them) -- both fixed.
        #   - the other 16: no discernible reason, passed cleanly.
        # test_health_endpoints.py is the one remaining, legitimate
        # exclusion: it's already run explicitly by the `server` job below
        # with real Postgres + JWT env configured, so excluding it here
        # avoids running it twice per push.
        run: |
          python -m pytest tests/unit/ \
            --ignore=tests/unit/test_health_endpoints.py \
            -v --tb=short -q

  regression:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scikit-learn httpx torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Download ground truth data
        run: python scripts/download_ground_truth.py --statsbomb --output data/ground_truth
      - name: Run regression tests
        run: python -m pytest tests/unit/test_regression_xg_models.py -v --tb=short

  server:
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: kawkab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,cloud]"
      - name: Run server tests (SQLite)
        env:
          KAWKAB_JWT_SECRET: ci-test-secret-do-not-use-in-production
        run: python -m pytest tests/unit/test_rbac.py tests/unit/test_oauth.py tests/unit/test_oauth_api.py tests/unit/test_health_endpoints.py -v --tb=short -q
      - name: Run Postgres integration tests
        env:
          KAWKAB_DB_URL: postgresql://postgres:ci_test@localhost:5432/kawkab
          KAWKAB_JWT_SECRET: ci-test-secret-do-not-use-in-production
        run: python -m pytest tests/unit/test_postgres_storage.py -v --tb=short -q

  tracking-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,cloud]"
      - name: Download ground truth data
        run: python scripts/download_ground_truth.py --metrica --output data/ground_truth
      - name: Run tracking benchmark
        run: python scripts/benchmark_tracking.py --output benchmark_results
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/

  benchmark:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,cloud]"
      - name: Run benchmark tests
        if: github.event_name == 'schedule'
        run: python -m pytest tests/unit/test_performance_benchmarks.py --run-load -v --tb=short
